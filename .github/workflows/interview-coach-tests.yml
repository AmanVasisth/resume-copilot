name: CareerCoach AI backend tests

on:
  push:
    branches: ["feature/interview-coach-v1"]
    paths:
      - "interview-coach/api/**"
      - ".github/workflows/interview-coach-tests.yml"
  pull_request:
    paths:
      - "interview-coach/api/**"
      - ".github/workflows/interview-coach-tests.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interview-coach
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run scoring benchmark tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s api/tests -v
